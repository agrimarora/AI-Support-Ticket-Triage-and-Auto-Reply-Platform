# Test Profile Configuration
spring:
  application:
    name: ticket-triage-platform-test
  datasource:
    # Overridden by @DynamicPropertySource in tests
    url: jdbc:postgresql://localhost:5433/ticketdb_test
    username: testuser
    password: testpass
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: localhost:9092
  data:
    redis:
      host: localhost
      port: 6379

ticket:
  outbox:
    publisher-fixed-delay-ms: 1000
    batch-size: 10
  kafka:
    topics:
      ticket-events: ticket-events-test
      ticket-events-dlt: ticket-events-test-dlt

# Disable Resilience4j circuit breaker for most tests (can be enabled selectively)
resilience4j:
  circuitbreaker:
    instances:
      llmReplyService:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5000ms
  retry:
    instances:
      llmReplyService:
        max-attempts: 2
        wait-duration: 100ms
  bulkhead:
    instances:
      llmReplyService:
        max-concurrent-calls: 10
  timelimiter:
    instances:
      llmReplyService:
        timeout-duration: 30s
