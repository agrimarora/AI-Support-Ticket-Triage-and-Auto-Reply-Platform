spring:
  application:
    name: ticket-triage-platform-test
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

ticket:
  outbox:
    publisher-fixed-delay-ms: 500
    batch-size: 50
  kafka:
    topics:
      ticket-events: ticket-events-test
      ticket-events-dlt: ticket-events-test-dlt
